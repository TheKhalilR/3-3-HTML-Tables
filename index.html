<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Challenge: The dinner table</title>
        <style>
          table, th, td {
            border: 1px solid;
          }
        </style>
    </head>
    <body>
    
        <h1>Our dinner menu</h1>
      
          <img src="plate_blue.jpg" width="50">
          <img src="plate_yellow.jpg" width="50">
      
        <table>
            <thead>
                <tr>
                    <th>Meal</th>
                    <th>Ingredients</th>
                    <th>Price</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Chopped Cheese</td>
                    <td>Cheese, Tomatoes, Lettuce, Ground beef and a roll or hero</td>
                    <td>$7.50-$9.00</td>
                </tr>
                <tr>
                    <td>Grilled Cheese</td>
                    <td>Cheese, Bread, Butter</td>
                    <td>$5.00-$10.00</td>
                </tr>
                <tr>
                    <td>Tacos</td>
                    <td>Tortillas, Meat, Cheese, Lettuce, Tomatoes, Sour cream</td>
                    <td>$10.00-$20.00</td>
                </tr>
            </tbody>
        </table>


    </body>
</html>
